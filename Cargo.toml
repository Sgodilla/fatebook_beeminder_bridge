[package]
name = "fatebook_beeminder_bridge"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.42", features = ["serde", "clock"] }
reqwest = { version = "0.12.24", features = ["json", "gzip"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["full"] }

# MongoDB
mongodb = "3.3.0"
bson = { version = "3.0.0", features = ["serde_json-1", "chrono-0_4", "serde"] }
uuid = { version = "1.18.1", features = ["v4"] }

# Logging
log = "0.4.28"
env_logger = "0.11.8"
anyhow = "1.0.100"
dotenvy = "0.15.7"
