services:
  fatebook_beeminder_bridge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fatebook_beeminder_bridge
    environment:
      - RUST_LOG=fatebook_beeminder_bridge=debug,reqwest=info

    env_file:
      - .env
    networks:
      - sgodilla-network
    restart: unless-stopped

networks:
  sgodilla-network:
    driver: bridge
